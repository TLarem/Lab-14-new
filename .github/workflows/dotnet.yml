
name: Build and Deploy .NET Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish ./Lab10_AntonyHuayhua.Api/Lab10_AntonyHuayhua.Api.csproj --configuration Release --no-restore --output ./published

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-published
          path: ./published


        
